plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.0'
    id 'io.spring.dependency-management' version '1.1.4'
}

group = 'com.procurement'
version = '1.0.0-SNAPSHOT'
description = 'Procurement Email Automation'

java {
    sourceCompatibility = '17'
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
    maven {
        url "https://package.bracits.com/repository/mvn-central/"
        name "central"
    }
    maven {
        url "https://package.bracits.com/repository/mvn-usis/"
        name "usis"
    }

}

ext {
    springIntegrationVersion = '6.2.0'
}

dependencies {
    // Spring Boot Starters
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'com.github.ben-manes.caffeine:caffeine'

    // Spring Integration
    implementation 'org.springframework.integration:spring-integration-mail'
    implementation 'org.springframework.integration:spring-integration-core'

    // Databases
    runtimeOnly 'com.h2database:h2'
    runtimeOnly 'org.postgresql:postgresql'

    // Keycloak
    implementation 'org.keycloak:keycloak-spring-boot-starter:23.0.1'
    implementation 'org.keycloak:keycloak-admin-client:23.0.1'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Jakarta Mail API
    implementation 'jakarta.mail:jakarta.mail-api'

    // Qdrant Java Client
    implementation 'io.qdrant:client:1.7.0'

    // Guava (required by Qdrant client)
    implementation 'com.google.guava:guava:32.1.3-jre'

    // Protocol Buffers (required by Qdrant client)
    implementation 'com.google.protobuf:protobuf-java:3.24.0'

    // gRPC dependencies (required by Qdrant client)
    implementation 'io.grpc:grpc-netty-shaded:1.58.0'
    implementation 'io.grpc:grpc-protobuf:1.58.0'
    implementation 'io.grpc:grpc-stub:1.58.0'

    // ONNX Runtime for ML Models
    implementation 'com.microsoft.onnxruntime:onnxruntime:1.16.3'

    // DJL (Deep Java Library) for tokenization
    implementation 'ai.djl.huggingface:tokenizers:0.25.0'

    // JSoup for HTML parsing and email cleaning
    implementation 'org.jsoup:jsoup:1.17.1'

    implementation 'com.bracits:bpa-client-spring-boot-starter:3.1.0.2-SNAPSHOT'
    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.integration:spring-integration-test'
}

tasks.named('test') {
    useJUnitPlatform()
}

bootJar {
    archiveFileName = "${archiveBaseName.get()}-${archiveVersion.get()}.${archiveExtension.get()}"
}
