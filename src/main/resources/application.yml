spring:
  application:
    name: procurement-email-automation
    profiles:
       active: dev

  # Email Configuration
  mail:
    host: ${EMAIL_HOST:imap.gmail.com}
    port: ${EMAIL_PORT:993}
    username: ${EMAIL_USERNAME:procurementpoc2025@gmail.coms}
    password: ${EMAIL_PASSWORD:nyez ixnu lsei dmmf}
    protocol: ${EMAIL_PROTOCOL:imaps}
    properties:
      mail:
        imaps:
          timeout: 10000
          connectiontimeout: 10000
        smtp:
          auth: true
          starttls:
            enable: true
          timeout: 10000

  # Database Configuration - PostgreSQL
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/mydb}
    driver-class-name: org.postgresql.Driver
    username: ${DATABASE_USERNAME:admin}
    password: ${DATABASE_PASSWORD:admin123}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

  h2:
    console:
      enabled: false  # Disabled when using PostgreSQL

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}  # Use 'update' for PostgreSQL, 'create-drop' for dev/test
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    database-platform: org.hibernate.dialect.PostgreSQLDialect

# Keycloak Configuration
keycloak:
  auth-server-url: ${KEYCLOAK_URL:http://localhost:8080}
  realm: ${KEYCLOAK_REALM:procurement}
  resource: procurement-service
  credentials:
    secret: ${KEYCLOAK_CLIENT_SECRET:}
  ssl-required: external
  public-client: false

# OpenRouter AI API Configuration
openrouter:
  api:
    url: ${OPENROUTER_API_URL:https://openrouter.ai/api/v1/chat/completions}
    key: ${OPENROUTER_API_KEY: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}
    model: ${OPENROUTER_MODEL:openai/gpt-4o-mini}
    timeout: 30000
    max-retries: 3

# Email Polling Configuration
email:
  polling:
    interval: 60000
    max-messages-per-poll: 10

# Qdrant Vector Database Configuration
qdrant:
  host: ${QDRANT_HOST:localhost}
  port: ${QDRANT_PORT:6334}
  use-tls: ${QDRANT_USE_TLS:false}
  collection:
    name: ${QDRANT_COLLECTION_NAME:inventory_items}
  vector:
    size: ${QDRANT_VECTOR_SIZE:384}

# Embedding Model Configuration
embedding:
  model:
    url: ${EMBEDDING_MODEL_URL:https://huggingface.co/sentence-transformers/all-MiniLM-L6-v2/resolve/main/onnx/model.onnx}
  tokenizer:
    url: ${EMBEDDING_TOKENIZER_URL:https://huggingface.co/sentence-transformers/all-MiniLM-L6-v2/resolve/main/tokenizer.json}
  cache:
    dir: ${EMBEDDING_CACHE_DIR:${java.io.tmpdir}/embedding-models}

# Logging Configuration
logging:
  level:
    root: INFO
    com.procurement.email: DEBUG
    org.springframework.integration: DEBUG
    org.springframework.mail: DEBUG
    org.keycloak: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
bpaclient:
  events:
    procurementAutomation: com.procurement.email.bpa.MyClassWorkflowActionEvent